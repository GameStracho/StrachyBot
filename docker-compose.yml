services:
  postgres-dev:
    container_name: postgres-dev
    image: postgres:15
    profiles:
      - development
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-Password1234}
      POSTGRES_DB: StrachyBot
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d StrachyBot" ]
      interval: 5s
      timeout: 2s
      retries: 5
  postgres:
    container_name: postgres
    image: postgres:15
    profiles:
      - production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-Password1234}
      POSTGRES_DB: StrachyBot
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d StrachyBot" ]
      interval: 5s
      timeout: 2s
      retries: 5
  adminer:
    container_name: adminer
    image: dockette/adminer:postgres
    profiles:
      - development
    env_file: .env
    ports:
      - ${ADMINER_PORT:-8080}:80
    depends_on:
      postgres-dev:
        condition: "service_healthy"
        required: true
    environment:
      # Enable the autologin plugin
      ADMINER_PLUGIN_AUTOLOGIN: "1"
      
      # Provide the unified DSN connection string
      # Format: pgsql://username:password@host:port/database
      ADMINER_AUTOLOGIN_SERVER: "pgsql://postgres:${DATABASE_PASSWORD:-Password1234}@postgres-dev:5432/StrachyBot"
  bot:
    build: .
    container_name: StrachyBot
    profiles:
      - production
    restart: always
    env_file: .env
    command: sh -c "alembic upgrade head && python src/main.py" 
    depends_on:
      postgres:
        condition: "service_healthy"
        required: true
    environment:
      CONNECTION_STRING: postgresql+asyncpg://postgres:${DATABASE_PASSWORD}@postgres:5432/StrachyBot

      # Force Python logs to show instantly
      PYTHONUNBUFFERED: "1"
