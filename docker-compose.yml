services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-Password1234}
      POSTGRES_DB: StrachyBot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d StrachyBot" ]
      interval: 5s
      timeout: 2s
      retries: 5

  socat:
    image: alpine/socat
    profiles:
      - development
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    # Socat listens locally on 5432 inside this container and forwards it to the 'postgres' service on port 5432
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: dockette/adminer:postgres
    profiles:
      - development
      - bot
      - api
      - production
    env_file: .env
    ports:
      - ${ADMINER_PORT:-8080}:80
    depends_on:
      postgres:
        condition: "service_healthy"
        required: true

  api:
    build: .
    profiles:
      - api
      - production
    restart: always
    env_file: .env
    ports:
      - ${API_PORT:-8000}:8000
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: "service_healthy"
        required: true
    environment:
      CONNECTION_STRING: postgresql+asyncpg://postgres:${DATABASE_PASSWORD}@postgres:5432/StrachyBot
      PYTHONUNBUFFERED: "1" # Force Python logs to show instantly

  api-internal:
    build: .
    profiles:
      - bot
    restart: always
    env_file: .env
    networks:
      default:
        aliases:
          - api
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: "service_healthy"
        required: true
    environment:
      CONNECTION_STRING: postgresql+asyncpg://postgres:${DATABASE_PASSWORD}@postgres:5432/StrachyBot
      PYTHONUNBUFFERED: "1"  # Force Python logs to show instantly

  bot:
    build: .
    profiles:
      - bot
      - production
    restart: always
    env_file: .env
    command: python bot/main.py
    depends_on:
      postgres:
        condition: "service_healthy"
        required: true
      api:
        condition: service_started
        required: false
      api-internal:
        condition: service_started
        required: false
    environment:
      CONNECTION_STRING: postgresql+asyncpg://postgres:${DATABASE_PASSWORD}@postgres:5432/StrachyBot
      API_URL: http://api:8000
      PYTHONUNBUFFERED: "1"

volumes:
  postgres_data:
